<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cursos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Cadastro de Cursos</h1>
    <p class="sub">Catálogo de formações da instituição</p>

    <form id="form-curso">
      <label for="nome">Nome do curso</label>
      <input type="text" id="nome" name="nome" required maxlength="255" placeholder="Ex.: Docker na Prática">

      <label for="instrutor">Instrutor responsável</label>
      <input type="text" id="instrutor" name="instrutor" required maxlength="255" placeholder="Ex.: Maria Silva">

      <div class="linha">
        <div>
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" required min="0" step="0.01" placeholder="0,00">
        </div>
        <div>
          <label for="vagas">Quantidade de vagas</label>
          <input type="number" id="vagas" name="vagas" required min="0" step="1" placeholder="0">
        </div>
      </div>

      <button type="submit" id="btn-salvar">Cadastrar curso</button>
    </form>

    <div id="mensagem" class="mensagem" role="status"></div>

    <a class="link" href="cursos.html">Listar todos os cursos</a>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const form = document.getElementById('form-curso');
    const btn = document.getElementById('btn-salvar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const curso = {
        nome: form.nome.value.trim(),
        instrutor: form.instrutor.value.trim(),
        preco: parseFloat(form.preco.value),
        vagas: parseInt(form.vagas.value, 10),
      };

      btn.disabled = true;
      try {
        const resp = await fetch(`${API_URL}/curso`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(curso),
        });
        const dados = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          const det = dados.detalhes ? ': ' + dados.detalhes.join('; ') : '';
          throw new Error((dados.erro || `Erro HTTP ${resp.status}`) + det);
        }
        mostrarMensagem(`Curso "${dados.nome}" cadastrado com sucesso (ID ${dados.id}).`, 'ok');
        form.reset();
      } catch (err) {
        mostrarMensagem(`Falha ao cadastrar: ${err.message}`, 'erro');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
